name: upstream-sync

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # UPSTREAM_SYNC_TOKEN must stay an environment secret limited to the default branch.
    environment: upstream-sync
    permissions:
      contents: write
      pull-requests: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(vars.UPSTREAM_SYNC_SOURCES) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Mirror upstream into a sync branch and open or refresh its PR
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          NAME: ${{ matrix.name }}
          URL: ${{ matrix.url }}
          REF: ${{ matrix.ref }}
          BUILD: ${{ matrix.build }}
        run: |
          set -euo pipefail
          if [ "$URL" = "parent" ]; then
            URL=$(gh api "repos/$REPO" --jq .parent.clone_url)
          fi
          branch="upstream-sync/$NAME"
          git fetch --no-tags "$URL" "$REF"
          upstream=$(git rev-parse FETCH_HEAD)
          number=$(gh pr list --repo "$REPO" --head "$branch" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if git merge-base --is-ancestor "$upstream" "origin/$BASE"; then
            echo "$NAME $REF (${upstream:0:8}) is already in $BASE"
            if [ -n "$number" ]; then
              gh pr close "$number" --repo "$REPO" --delete-branch --comment "Upstream ${upstream:0:8} is already in $BASE."
            fi
            exit 0
          fi
          if [ "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$upstream" ]; then
            echo "$branch already at ${upstream:0:8}"
            exit 0
          fi
          if ! git push --force origin "$upstream:refs/heads/$branch"; then
            echo "::error::Push of $branch was refused. Upstream changes .github/workflows, which needs the UPSTREAM_SYNC_TOKEN environment secret with workflow permission."
            exit 1
          fi
          count=$(git rev-list --count "origin/$BASE..$upstream")
          body="Automated: \`$branch\` mirrors \`$URL\` \`$REF\` at \`${upstream:0:8}\`, $count commits not yet in \`$BASE\`.

          This branch is force-updated on every upstream change, so do not push to it. To resolve conflicts, branch from it, merge \`$BASE\` in, and open a separate PR."
          if [ -z "$number" ]; then
            gh pr create --repo "$REPO" --base "$BASE" --head "$branch" --title "chore: sync upstream $NAME" --body "$body"
          else
            gh pr edit "$number" --repo "$REPO" --body "$body"
          fi
          if [ "$HAS_PAT" != "true" ]; then
            gh workflow run "$BUILD" --repo "$REPO" --ref "$branch" || echo "::warning::$BUILD has no workflow_dispatch on $branch; add the UPSTREAM_SYNC_TOKEN environment secret so the PR triggers CI itself"
          fi

  fork-watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: List active forks that upstream-sync does not track
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          SOURCES: ${{ vars.UPSTREAM_SYNC_SOURCES }}
          NETWORK_ROOT: ${{ vars.UPSTREAM_SYNC_NETWORK }}
        run: |
          set -euo pipefail
          python .github/scripts/fork_watch.py
          title="Upstream fork watch"
          number=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -z "$number" ]; then
            gh issue create --repo "$REPO" --title "$title" --body-file fork-watch.md
          else
            gh issue edit "$number" --repo "$REPO" --body-file fork-watch.md
          fi
